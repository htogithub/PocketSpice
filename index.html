  async function exportCircuit() {
    const d = new Date(), p2 = (n) => String(n).padStart(2, '0');
    const name = `pocketspice-${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}.json`;
    const data = { app: 'PocketSpice', format: 1, savedAt: d.toISOString(), comps: S.comps.map(({ id, ...c }) => c), wires: S.wires.map(({ id, ...w }) => w), netlist: genNetlist().text };
    const json = JSON.stringify(data, null, 1);
    let file = null;
    try { file = new File([json], name, { type: 'application/json' }); } catch (_) { file = null; }
    if (file && navigator.canShare && navigator.share) {
      try {
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try {
      const url = URL.createObjectURL(file || new Blob([json], { type: 'application/json' }));
      const link = document.createElement('a');
      link.href = url; link.download = name; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast(t('toast.exported'));
    } catch (_) { copyText(json, t('toast.exportCopied')); }
  }
  function loadCircuitData(d) {
    if (!d || typeof d !== 'object' || !Array.isArray(d.comps) || !Array.isArray(d.wires)) throw new Error('format');
    const int = (v) => (typeof v === 'number' && isFinite(v) ? Math.round(v) : null);
    const used = new Set(), comps = [];
    for (const c of d.comps) {
      if (!c || !PINS[c.type]) continue;
      const x = int(c.x), y = int(c.y);
      if (x === null || y === null) continue;
      const props = JSON.parse(JSON.stringify(DEFAULT_PROPS[c.type]));
      if (c.props && typeof c.props === 'object') for (const k of Object.keys(props)) if (c.props[k] !== undefined && c.props[k] !== null) props[k] = String(c.props[k]).slice(0, 40);
      let name = '';
      if (c.type !== 'GND' && c.type !== 'LBL') {
        name = String(c.name || '').replace(/[\s;*=(),]+/g, '').slice(0, 24);
        if (name && name[0].toUpperCase() !== c.type) name = c.type + name;
        if (used.has(name.toLowerCase())) name = '';
        if (name) used.add(name.toLowerCase());
      }
      comps.push({ id: nid(), type: c.type, x, y, rot: (((int(c.rot) || 0) % 4) + 4) % 4, mirror: !!c.mirror, name, props });
    }
    for (const c of comps) {
      if (c.type === 'GND' || c.type === 'LBL' || c.name) continue;
      let k = 1; while (used.has((c.type + k).toLowerCase())) k++;
      c.name = c.type + k; used.add(c.name.toLowerCase());
    }
    const wires = d.wires.map((w) => ({ id: nid(), x1: int(w && w.x1), y1: int(w && w.y1), x2: int(w && w.x2), y2: int(w && w.y2) }))
      .filter((w) => [w.x1, w.y1, w.x2, w.y2].every((v) => v !== null) && (w.x1 !== w.x2 || w.y1 !== w.y2));
    if (!comps.length && !wires.length) throw new Error('empty');
    pushUndo();
    S.comps = comps; S.wires = wires; sel = null; results = null;
    setTab('schema'); edited(); renderSheet(); renderResults(); fit();
    if (netEl.value === lastGen || !netEl.value.trim()) syncNetlist(true);
    toast(t('toast.imported'));
  }

  const splash = document.getElementById('splash');
  if (splash) {
    if (standalone) requestAnimationFrame(() => setTimeout(() => { splash.classList.add('out'); setTimeout(() => { splash.remove(); document.documentElement.classList.remove('splashing'); }, 450); }, 280));
    else splash.remove();

  // En plein écran, iOS peut limiter la zone d'affichage à une hauteur inférieure à l'écran :
  // on mesure l'écart avec la vraie hauteur et la marge du bas en tient compte (CSS --vp-gap).
  function fixStandaloneHeight() {
    if (!standalone) return;
    const portrait = window.innerHeight >= window.innerWidth;
    const full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);

    const dpr = window.devicePixelRatio || 1, w = Math.round(screen.width * dpr), h = Math.round(screen.height * dpr);

        const g = cv.getContext('2d');
        g.fillStyle = '#0e1822'; g.fillRect(0, 0, w, h);
        const s = Math.round(Math.min(w, h) * 0.3), x = (w - s) / 2, y = h / 2 - s * 0.62, r = s * 0.22;
        g.save(); g.beginPath();
        g.moveTo(x + r, y); g.arcTo(x + s, y, x + s, y + s, r); g.arcTo(x + s, y + s, x, y + s, r); g.arcTo(x, y + s, x, y, r); g.arcTo(x, y, x + s, y, r); g.closePath(); g.clip();
        g.drawImage(img, x, y, s, s); g.restore();
        g.fillStyle = '#e8eef2'; g.textAlign = 'center'; g.textBaseline = 'top';

        g.fillText('PocketSpice', w / 2, y + s + 22 * dpr);

      }).catch(() => { /* hors ligne indisponible ici */ });
    });
  }

  window.__ps = { S: () => S, run: runSchematic, gen: genNetlist, loadExample, setTool, view };
})();
